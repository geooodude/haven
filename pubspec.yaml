name: havennyc
description: HavenNYC — homeless support network for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  firebase_storage: ^13.4.2
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  flutter_blue_plus: ^2.3.8
  flutter_secure_storage: ^10.3.1
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  flutter_gen_runner: ^5.14.1

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: false

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/icons/
    - assets/images/
